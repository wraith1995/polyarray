[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyarray"
version = "0.1.0"
description = "Standalone symbolic-numeric array IR (Program/Stmt/SymArray/RationalFunction + poly backends), extracted from chartlib."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Thea Collin", email = "teoc@mit.edu" },
]
dependencies = [
    "numpy>=2.0",
    "sympy>=1.13",
]

[project.optional-dependencies]
# python-flint enables the fast exact-rational "flint" backend; it is
# auto-detected at import time and falls back to sympy when absent.
flint = ["python-flint>=0.8.0"]
dev = [
    "cython>=3.0",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.1",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
# Parallel by default (pytest-xdist): each worker is its own process, so the torch 1-rank
# gloo group (tests/conftest.py) binds a distinct free port per worker — no MASTER_PORT
# collision. Override with `-n0` for a serial run / debugger.
addopts = "-n auto"
# Per-test wall-clock budget (pytest-timeout; §E1 blow-up blocker-avoidance): an IR blow-up FAILS FAST
# instead of hanging/OOMing. `thread` method (NOT SIGALRM — the torch gloo init above uses signals).
# 300 s is generous (≫ any legit single test, ≪ a real blow-up); tighten with `--durations` follow-up.
# Override with `--timeout=N`; a heavier test raises its own bar with `@pytest.mark.timeout(N)`.
timeout = 300
timeout_method = "thread"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The Cython extension modules are built from setup.py (see the project
# root). setuptools.build_meta picks up setup.py's ext_modules so wheels
# ship the compiled .so files. Pure-Python source install / editable dev
# can instead use `make cython`.
[tool.setuptools.package-data]
polyarray = ["*.pyx"]

# ---------------------------------------------------------------------------
# cibuildwheel — build binary wheels with the Cython cpp backends precompiled
# so `pip install polyarray` needs no local C++ toolchain. The pure-Python
# backends remain a working fallback if a wheel is absent.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp313-* cp314-*"
build-frontend = "build"
# numpy + Cython are in build-system.requires, so the isolated build env has
# them; nothing extra needed before build.
test-requires = ["pytest", "numpy", "sympy"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
# manylinux images ship a modern gcc; -O3 -ffast-math come from setup_cython.

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

# mypy — chartLib's config is the model (fem CLAUDE.md rule 3); run: .venv/bin/mypy
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true

# ---------------------------------------------------------------------------
# Documentation + annotation gate: `ruff check --select D,ANN src` (see the
# `lint` Makefile target). Deliberately narrow — this enforces the docstring
# and typing contract, not general style.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["D", "ANN"]
ignore = [
    "D105",   # magic methods: the language fixes their meaning
    "D107",   # __init__: documented by the class docstring
    "D203",   # incompatible with D211 (no blank line before a class docstring)
    "D213",   # summary starts on the first line, not the second
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Modules still awaiting the docstring/annotation sweep. This list only shrinks;
# adding an entry needs a reason.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"setup*.py" = ["D", "ANN"]

# numpydoc validation (`numpydoc lint src/polyarray/*.py`): checks that the
# sections a docstring does declare match the signature.
[tool.numpydoc_validation]
# Consistency, not completeness: a docstring need not document every parameter (ruff's
# D rules already require the docstring itself), but whatever it does declare must
# match the signature.
checks = [
    "GL06",  # unknown section name
    "GL07",  # sections out of order
    "GL09",  # deprecation warning misplaced
    "SS03",  # summary lacks a period
    "PR02",  # a documented parameter that is not in the signature
    "PR03",  # documented parameters out of signature order
    "RT02",  # return section names a variable where it should give a type
]
# Module docstrings carry free-form prose sections (Sphinx renders them); the section
# vocabulary above applies to callables and classes only.
exclude = [
    '^[A-Za-z_][A-Za-z_0-9]*$',  # the module node itself (an undotted name)
    '\.__init__$',
    '\.__repr__$',
    '\.__eq__$',
]
