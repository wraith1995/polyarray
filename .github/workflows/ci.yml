name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
        # torch- and PyArrayBackend-dependent tests skip via importorskip; the
        # core suite runs on the pure-Python backends.

  docs:
    name: docs (zero-warning build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and docs deps
        run: pip install -e ".[docs]"
      - name: Build docs with warnings as errors
        run: sphinx-build -W -b html docs/source docs/build/html

  types:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    # mypy still reports a baseline of errors; the job surfaces the count and
    # trend without blocking the build. Make it a required gate once it reaches zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: mypy
