name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test deps
        # flint is included: the exact-fold suite asserts exact-rational results
        # (1/3, x + 1), which only hold on the flint backend; without it the
        # sympy RR fallback yields floats and those tests fail.
        run: pip install -e ".[dev,flint]"
      - name: Run tests
        run: pytest -q
        # torch- and PyArrayBackend-dependent tests skip via importorskip.

  docs:
    name: docs (zero-warning build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and docs deps
        run: pip install -e ".[docs]"
      - name: Build docs with warnings as errors
        run: sphinx-build -W -b html docs/source docs/build/html

  types:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # mypy still reports a baseline of errors; run it for the count and trend in
      # the log without failing the check. Drop the `|| true` to make it a gate
      # once the baseline reaches zero.
      - run: mypy || true
